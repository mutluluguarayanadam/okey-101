<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a120b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>101 Okey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="lobby" class="screen">
    <div class="panel lobbypanel">
      <div class="lobbytools"><button id="btnHelpL" class="icon" title="Nasıl oynanır">❔</button><button id="btnSettingsL" class="icon" title="Ayarlar">⚙️</button></div>
      <h1 class="logo"><span class="lt r">1</span><span class="lt k">0</span><span class="lt b">1</span> Okey</h1>
      <div class="row idrow">
        <button id="btnAvatar" class="avapick" title="Avatarını seç"></button>
        <label class="field grow">Adın<input id="name" maxlength="16" autocomplete="nickname"></label>
        <button id="btnCreate">Oda kur</button>
      </div>
      <button id="btnQuick" class="primary wide quick">⚡ Hemen oyna</button>
      <div class="roomshead"><h3>Açık masalar</h3><button id="btnRefresh" class="icon" title="Yenile">↻</button></div>
      <div id="roomList" class="roomlist"></div>
      <details class="bycode"><summary>Kodla katıl</summary>
        <div class="row"><input id="code" placeholder="Oda kodu" maxlength="5" class="grow code-input"><button id="btnJoin">Katıl</button></div>
      </details>
    </div>
  </section>

  <section id="waiting" class="screen hidden">
    <div class="panel roompanel">
      <h2>Oda <span id="wCode" class="code"></span></h2>
      <div class="linkbox"><span id="wLink"></span><button id="btnCopy" class="small">Kopyala</button><button id="btnShare" class="small primary">Paylaş</button></div>
      <div class="minitable" id="wTable"></div>
      <p class="muted center-text" id="wNote"></p>
      <div id="wSettings" class="settings"></div>
      <button id="btnStart" class="primary wide">Oyunu başlat</button>
      <button id="btnLeaveRoom" class="wide ghostbtn">Odadan çık</button>
    </div>
  </section>

  <section id="game" class="screen hidden">
    <header class="topbar">
      <div class="roominfo"><b id="gCode"></b><span id="gHand"></span><span id="gTeam" class="teamscore"></span></div>
      <div id="status"></div>
      <div class="tbtns">
        <button id="btnChat" class="icon" title="Sohbet">💬</button>
        <button id="btnSettings" class="icon" title="Ayarlar">⚙️</button>
        <button id="btnFull" class="icon" title="Tam ekran">⛶</button>
        <button id="btnTrack" class="icon" title="Atılan ve çıkan taşlar">🧮</button>
        <button id="btnScores" class="icon" title="Puanlar ve oyun akışı">🏆</button>
        <button id="btnLeave" class="icon" title="Oyundan çık">🚪</button>
      </div>
    </header>

    <div class="mtop" id="mtop"><span class="mt-left"></span><div class="mt-timer"><div class="mt-bar"><i></i></div></div><span class="mt-right"></span></div>
    <div class="arena">
      <div class="table">
        <div class="player p-top" id="pos2"></div>
        <div class="player p-left" id="pos3"></div>
        <div class="player p-right" id="pos1"></div>
        <div class="corner c-tl" id="corner2"></div>
        <div class="corner c-tr" id="corner1"></div>
        <div class="corner c-bl" id="corner3"></div>
        <div class="corner c-br" id="corner0"></div>
        <div class="center">
          <div class="stock">
            <div class="stack"><div id="indicator"></div><small>Gösterge</small></div>
            <button id="pile" class="pile" title="Yığından çek"><span id="pileCount"></span></button>
          </div>
          <div id="melds" class="melds"><div class="bseri" id="seriBoard"></div><div class="bcift" id="ciftBoard"></div></div>
          <div id="ticker" class="ticker"></div>
        </div>
        <div id="infoCol" class="infocol"><div id="modeInfo" class="modeinfo"></div></div>
      </div>
    </div>

    <div id="chatPanel" class="chatpanel hidden">
      <div id="chatLog" class="chatlog"></div>
      <div class="quick" id="quick"></div>
      <form id="chatForm" class="chatform"><input id="chatInput" maxlength="80" placeholder="Mesaj yaz" autocomplete="off"><button class="small">Gönder</button></form>
    </div>
    <div class="dock">
      <div id="rotateTip" class="rotatetip">Telefonu yan çevirirsen taşlar büyür <button id="btnTipClose" class="icon">✕</button></div>
      <div class="dockbar">
        <button id="btnMenu" class="icon menubtn" title="Menü">☰</button>
        <div id="meChip" class="mechip"></div>
        <div id="handScore" class="handscore"></div>
        <div class="actions">
          <button data-act="undoRack" class="icon-btn hidden" title="Dizilimi geri al">↶</button>
          <button data-act="hint" class="icon-btn" title="Öneri: hangi taşı atmalıyım?">💡</button>
          <button data-act="seri">Seri diz</button>
          <button data-act="cift">Çift diz</button>
          <button data-act="undo" class="warn">Geri koy (101 ceza)</button>
          <button data-act="auto" class="hidden">İşle</button>
          <button data-act="openSeri" class="primary act-open">Seri aç</button>
          <button data-act="openCift" class="primary act-open">Çift aç</button>
        </div>
      </div>
      <div id="turnbar" class="turnbar"><i></i></div>
      <div class="rackline" id="rackline">
        <button id="bigCift" class="bigdiz" title="Çift diz"><span class="mini"><i>5</i><i>5</i></span>ÇİFT<br>DİZ</button>
        <div id="rack" class="rack"></div>
        <button id="bigSeri" class="bigdiz" title="Seri diz"><span class="mini"><i>1</i><i>2</i><i>3</i></span>SERİ<br>DİZ</button>
      </div>
      <p class="hint" id="hint"></p>
    </div>
    <aside id="side" class="side"></aside>
    <div id="menuPop" class="menupop hidden"></div>
  </section>

  <div id="modal" class="modal hidden"><button id="modalX" class="modalx" aria-label="Kapat" title="Kapat">✕</button><div class="panel" id="modalBody"></div></div>
  <div id="toast" class="toast"></div>
  <div id="turnFlash" class="turnflash">Sıra sende!</div>
  <canvas id="confetti" class="confetti"></canvas>
  <div id="netbar" class="netbar hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="rules.js"></script>
  <script src="client.js"></script>
</body>
</html>
